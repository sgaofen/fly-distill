<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}fly-distill atlas{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, "Helvetica Neue", "PingFang SC", sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .conf-high { color: #16a34a; }
    .conf-medium { color: #ca8a04; }
    .conf-low { color: #dc2626; }
    .cat-tag { font-size: 0.75rem; padding: 0.125rem 0.375rem; border-radius: 0.25rem;
               background: #f3f4f6; color: #4b5563; font-weight: 500; }
    details > summary { cursor: pointer; user-select: none; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: "▸ "; color: #9ca3af; }
    details[open] > summary::before { content: "▾ "; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900">
  <header class="border-b border-stone-200 bg-white">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center gap-6">
      <a href="/" class="font-semibold text-stone-900">fly-distill atlas</a>
      <form action="/search" method="get" class="flex-1">
        <input type="search" name="q" value="{{ q or '' }}"
               placeholder="search gene symbol, FBgn, phenotype, or quote (e.g. 'eye AND lethal')"
               class="w-full px-3 py-1.5 text-sm border border-stone-300 rounded
                      focus:outline-none focus:border-stone-500"
               autofocus>
      </form>
      <nav class="text-sm text-stone-600 flex gap-4">
        <a href="/" class="hover:text-stone-900">stats</a>
        <a href="/search" class="hover:text-stone-900">search</a>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-6 py-6">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-6xl mx-auto px-6 py-6 text-xs text-stone-500 border-t border-stone-200 mt-12">
    fly-distill atlas · 14019 Drosophila genes distilled by Claude Sonnet, GLM-5.1, GPT-5.5, MiMo v2.5-Pro, Gemini 3 Flash
    · <a href="https://flybase.org" class="underline">FlyBase</a>
    · local index over output/genes/*.json
  </footer>
</body>
</html>
